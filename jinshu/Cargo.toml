[package]
description = "A database file system for the Amentys project"
edition = "2024"
name = "jinshu"
version = "0.1.0"

[lib]
bench = false
doctest = true
name = "jinshu"
path = "src/lib.rs"
test = true

[dependencies]
blake3 = { version = "1.8.6", default-features = false }
heapless = { version = "0.9.3", default-features = false }
kpack = {path = "../kpack", version = "0.1.0"}
noun = {path = "../noun", version = "0.1.0"}
