[package]
description = "Merkle-backed storage engine and Noun graph database on NVMe"
license = "LicenseRef-ASAL"
license-file = "../LICENSE"
keywords = ["jinshu", "storage", "merkle", "database"]
edition = "2024"
name = "jinshu"
version = "0.1.0"

[lib]
bench = false
doctest = true
name = "jinshu"
path = "src/lib.rs"
test = true

[dependencies]
blake3 = { version = "1.8.6", default-features = false }
heapless = { version = "0.9.3", default-features = false }
kpack = {path = "../kpack", version = "0.1.0"}
noun = {path = "../noun", version = "0.1.0"}
