[package]
name = "plan"
version = "0.1.0"
edition = "2024"
description = "Process manifest: defines layers and capabilities for sandboxed runs"
license = "LicenseRef-ASAL"
license-file = "../LICENSE"
keywords = ["plan", "manifest", "sandbox", "capability"]

[lib]
bench = false
doctest = true
name = "plan"
path = "src/lib.rs"
test = true

[dependencies]
heapless = { version = "0.9.3", default-features = false, features = [] }
noun = { version = "0.1.0", path = "../noun", default-features = false, features = [] }
