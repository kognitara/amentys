[package]
edition = "2024"
name = "re"
version = "0.1.0"

[[bin]]
bench = false
doctest = false
name = "re"
path = "src/main.rs"
test = false

[features]
default = ["fr"]
fr = []
us = []

[dependencies]
lazy_static = { version = "1.4", default-features = false, features = [
    "spin_no_std",
] }
spin = { version = "0.12.2", default-features = false, features = [
    "mutex",
    "spin_mutex",
] }
x86_64 = { version = "0.15.5", default-features = false, features = [
    "instructions",
    "abi_x86_interrupt",
] }
limine = { version = "0.6.5", default-features = false, features = [
    "ipaddr",
    "uuid",
] }
xmas-elf = "0.10.0"
os-terminal = { version = "0.7.4", default-features = false, features = ["bitmap"] }
linked_list_allocator = "0.10.5"
