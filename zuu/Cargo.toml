[package]
name = "zuu"
version = "0.1.0"
edition = "2024"
description = "Steganographic network layer: signal distortion and covert pressure"
keywords = ["zuu", "network", "steganography", "pressure"]

[dependencies]
chacha20 = { version = "0.10.1", default-features = false, features = [
    "cipher",
] }
rand_chacha = { version = "0.10.0", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false }
